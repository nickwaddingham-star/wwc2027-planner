<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FIFA Women’s World Cup Brazil 2027™ Trip Planner (prototype)</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <!-- The two-level bar follows the one on fifa.com's tournament pages. -->
  <header class="siteheader">
    <div class="topbar"><div class="wrap">
      <span id="brand-fifa"></span>
      <div class="topright">
        <nav class="fifalinks" id="fifa-links"></nav>
        <span class="lang" id="language"></span>
        <span id="search"></span>
        <span id="account"></span>
        <span class="prototype" id="prototype"></span>
      </div>
    </div></div>
    <div class="eventbar"><div class="wrap">
      <span id="brand-event"></span>
      <nav class="eventnav" id="event-nav"></nav>
    </div></div>
  </header>
  <section class="countdown" id="countdown"></section>
  <nav class="steps"><div class="wrap"><ol id="steps"></ol></div></nav>
  <div class="notice"><div class="wrap" id="notice"></div></div>
  <div class="wrap layout" id="layout">
    <div class="column">
      <p id="flash" class="flash" role="status"></p>
      <main id="main" tabindex="-1"></main>
    </div>
    <aside id="side"></aside>
  </div>
  <footer><div class="wrap" id="footer"></div></footer>
  <noscript><p>This planner needs JavaScript.</p></noscript>

  <script src="js/airports.js"></script>
  <script src="js/data.js"></script>
  <script src="js/approved.js"></script>
  <script src="js/brand.js"></script>
  <script src="js/strings.js"></script>
  <script src="js/planner.js"></script>
  <script src="js/trips.js"></script>
  <script src="js/account.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
