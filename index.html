<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FIFA Women’s World Cup Brazil 2027™ Trip Planner (prototype)</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Poppins:wght@500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header>
    <div class="topbar"><div class="wrap"><span id="brand-fifa"></span><span class="prototype" id="prototype"></span></div></div>
    <div class="eventbar"><div class="wrap"><span id="brand-emblem"></span><span><strong id="tournament"></strong><small id="sitename"></small></span></div></div>
    <div class="pattern" aria-hidden="true"></div>
    <div class="notice"><div class="wrap" id="notice"></div></div>
  </header>
  <nav class="steps"><div class="wrap"><ol id="steps"></ol></div></nav>
  <div class="wrap layout">
    <main id="main" tabindex="-1"></main>
    <aside id="side"></aside>
  </div>
  <footer><div class="wrap" id="footer"></div></footer>
  <noscript><p>This planner needs JavaScript.</p></noscript>

  <script src="js/airports.js"></script>
  <script src="js/data.js"></script>
  <script src="js/approved.js"></script>
  <script src="js/brand.js"></script>
  <script src="js/strings.js"></script>
  <script src="js/planner.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
